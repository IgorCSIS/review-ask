<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Review Ask. One short ask after the job, a gentle reminder if the link was not tapped, and a thank-you after. Four timeline steps at 0, 4, 8 and 11 seconds.">
  <title>Review Ask</title>
  <desc>The after-job Google review ask for East County trades. A simulated demo: one short ask by text or email, a gentle reminder two days later only if the link has not been tapped, the tap itself, and a thank-you after it. Nothing is ever sent.</desc>
  <rect width="1200" height="300" rx="16" fill="#070E18"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#1B2A40"/>
  <g transform="translate(64 108) scale(2.1)">
    <rect width="32" height="32" rx="7" fill="#070E18"/>
    <path d="M6 9.5a2.5 2.5 0 0 1 2.5-2.5h15A2.5 2.5 0 0 1 26 9.5v9a2.5 2.5 0 0 1-2.5 2.5H14l-5.2 4.1A.6.6 0 0 1 7.8 24.6V21h-1.3A.5.5 0 0 1 6 20.5z" fill="#F59E0B"/>
    <path d="M16 9.6l1.79 3.63 4.01.58-2.9 2.83.68 3.99L16 18.75l-3.58 1.88.68-3.99-2.9-2.83 4.01-.58z" fill="#070E18"/>
  </g>
  <text x="212" y="126" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Review Ask</text>
  <text x="214" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#8FA3BC">The after-job review ask for trades</text>
  <circle cx="221" cy="192" r="5" fill="#F59E0B"/>
  <text x="235" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3BC">Simulated demo. Nothing is sent.</text>
  <text x="660" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8FA3BC">ONE ASK, ONE REMINDER, ONE THANK-YOU</text>
  <g transform="translate(660 62)">
    <rect width="474" height="44" rx="10" fill="#111C2E" stroke="#1B2A40"/>
    <text x="18" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#F59E0B">0s</text>
    <text x="72" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC">Review ask sent</text>
  </g>
  <path d="M690 106 L690 118" stroke="#2A3D57" stroke-width="2"/>
  <g transform="translate(660 118)">
    <rect width="474" height="44" rx="10" fill="#111C2E" stroke="#1B2A40"/>
    <text x="18" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#F59E0B">4s</text>
    <text x="72" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC">Gentle reminder</text>
  </g>
  <path d="M690 162 L690 174" stroke="#2A3D57" stroke-width="2"/>
  <g transform="translate(660 174)">
    <rect width="474" height="44" rx="10" fill="#111C2E" stroke="#1B2A40"/>
    <text x="18" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#FBBF24">8s</text>
    <text x="72" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC">Review link tapped</text>
  </g>
  <path d="M690 218 L690 230" stroke="#2A3D57" stroke-width="2"/>
  <g transform="translate(660 230)">
    <rect width="474" height="44" rx="10" fill="#111C2E" stroke="#1B2A40"/>
    <text x="18" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#F59E0B">11s</text>
    <text x="72" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#F8FAFC">Thank-you sent</text>
  </g>
