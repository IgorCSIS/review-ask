name: Deploy to Pages

# There is no build step on purpose. The page is hand-written HTML, CSS and
# JavaScript, so what is in the repository is exactly what gets served. That
# keeps the whole thing free to host and impossible to break with a bundler.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The repository root is the site. Everything outside it is either
          # licence text or this workflow, neither of which is served.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
